[project]
name = "playlist-gen"
version = "0.2.0"
description = "Turn an Apple Music playlist into a YouTube-ready video"
readme = "README.md"
requires-python = ">=3.10"
dependencies = [
    "textual",
    "yt-dlp[default]",
    "pillow",
    "requests",
    "numpy",
    "playwright",
    "tqdm",
]

[project.scripts]
playlist-gen = "playlist_video.tui.app:main"
playlist-gen-cli = "playlist_video.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["playlist_video"]

[dependency-groups]
dev = [
    "pytest>=8.0",
    "ruff>=0.6",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
line-length = 100
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "W"]
ignore = ["E501"]
